# Zie onderhouden/contractverlenging.yaml voor uitleg bij elk veld.
code: VER-01
name: MJOP-vervangingen
version: 1.0.0
status: concept
phase: vervangen
segments:
- installatie-onderhoud
needs_blueprint: true
owner: accountmanager
priority: 2
summary: Geplande vervangingen uit het meerjarenonderhoudsplan worden op tijd een offerte.
trigger: 6 maanden voor een geplande vervanging in het MJOP.
goal: De vervanging als opdracht bij jou, niet als spoedklus bij een ander.
enroll:
  object: mjop
  at: mjop.vervanging_op - 6m
steps:
- id: s1
  at: mjop.vervanging_op - 6m
  action: taak
  owner: accountmanager
  sla: 10 werkdagen
  brief: Bekijk de MJOP-regel en de staat van de installatie.
- id: s2
  at: mjop.vervanging_op - 5m
  action: e-mail
  to: klant.contactpersoon
  brief: Deze vervanging staat gepland, en zo bereiden we haar voor.
- id: s3
  at: mjop.vervanging_op - 4m
  action: taak
  owner: accountmanager
  sla: 10 werkdagen
  brief: Offerte maken en bespreken.
exit:
- offerte.status = Verstuurd
handover:
  won: 'Offerte verstuurd: de offerteopvolging neemt het over.'
next: offerteopvolging
fields:
- mjop.vervanging_op
- mjop.onderdeel
- mjop.budgetjaar
- installatie.staat
- installatie.type
- offerte.status
- klant.contactpersoon
- klant.accountmanager
metrics:
- geplande_vervangingen
- vervanging_gewonnen
- maanden_contact_tot_opdracht
