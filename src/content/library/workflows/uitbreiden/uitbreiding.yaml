# Zie onderhouden/contractverlenging.yaml voor uitleg bij elk veld.
code: UIT-01
name: Uitbreiding
version: 1.0.0
status: concept
phase: uitbreiden
segments:
- installatie-onderhoud
- groothandel
- zakelijke-dienstverlening
needs_blueprint: true
owner: accountmanager
priority: 4
summary: Klanten die één ding van je afnemen, horen op het juiste moment over het tweede.
updated: 2026-10-09
trigger: Een klant neemt één dienst of installatie van je af, en een tweede past erbij.
goal: De uitbreiding bij jou, niet bij wie er toevallig is.
enroll:
  object: klant
  'on': elk kwartaal
  if:
  - klant.diensten bevat de ene dienst en niet de andere
  not_if:
  - klant.open_storing = ja
  - klant.laatste_contact_op korter dan 30 dagen geleden
steps:
- id: s1
  title: Uitleg over de tweede dienst
  after: direct
  action: e-mail
  to: klant.contactpersoon
  brief: Uitleg over de tweede dienst, in de taal van wat de klant al heeft. Geen algemene nieuwsbrief.
- id: s2
  title: Bellen na een klik of reactie
  'on': klik of reactie op s1
  action: taak
  owner: accountmanager
  sla: 2 werkdagen
  brief: Bel, met wat de klant al afneemt.
- id: s3
  title: Terug in de lijst voor volgend kwartaal
  after: 30d
  if: geen reactie
  action: systeem
  brief: Terug in de lijst voor het volgende kwartaal.
exit:
- offerte gevraagd
- na de laatste stap
handover:
  won: 'Interesse: er wordt een offerte gemaakt en de offerteopvolging start.'
next: offerteopvolging
fields:
- klant.diensten
- klant.laatste_contact_op
- klant.open_storing
- klant.contactpersoon
- klant.accountmanager
- installatie.type
metrics:
- kandidaten_uitbreiding
- uitbreiding_afgenomen
- dagen_bericht_tot_offerte
seo:
  title: Cross-sell automatiseren voor B2B
  description: 'Workflow voor uitbreiding bij bestaande klanten: wie één dienst afneemt, hoort op het juiste moment over de tweede. Met CRM-velden en metingen.'
why: Een bestaande klant kent je al, en toch gaat een uitbreiding vaak naar wie er toevallig is. Meestal omdat niemand bijhoudt wat een klant wel en niet afneemt. Deze workflow maakt elk kwartaal een lijst van klanten met de ene dienst en zonder de andere, stuurt uitleg die aansluit op wat ze al hebben, en zet een belopdracht klaar zodra iemand reageert.
example: 'Stel: 300 klanten met onderhoud, maar zonder beveiliging. Neemt 5% per jaar de tweede dienst af, dan zijn dat 15 nieuwe contracten.'
mistakes:
- Iedereen dezelfde nieuwsbrief sturen. Uitbreiding werkt alleen als het aansluit op wat de klant al heeft.
- Klanten benaderen terwijl er een storing openstaat.
- Geen pauze inbouwen. Wie niet reageert, hoort het volgende kwartaal weer van je, niet volgende week.
faq:
- q: Welke combinaties van diensten werken?
  a: Combinaties die logisch volgen uit wat er al staat, zoals onderhoud bij een installatie die je zelf hebt geplaatst. Welke dat bij jou zijn, bepaal je vooraf.
