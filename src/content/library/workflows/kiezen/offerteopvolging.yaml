# Zie onderhouden/contractverlenging.yaml voor uitleg bij elk veld.
code: KIE-01
name: Offerteopvolging
version: 1.0.0
status: concept
phase: kiezen
segments: [installatie-onderhoud, machinebouw, it-dienstverlening, verhuur-en-lease]
needs_blueprint: false
owner: verkoper
priority: 1
track: opvolgen              # aantrekken | opvolgen | houden: de uitkomst waaronder de workflow in het menu valt
summary: 'Geen offerte die stil blijft liggen. Elke offerte krijgt een vaste opvolging, tot ja of nee. Zodat je meer offertes wint en weet waarom je de rest verliest.'
outcome:
  context: 'Bedrijven in installatie, machinebouw, IT-dienstverlening en verhuur die offertes sturen voor projecten, contracten of leveringen.'
  issue: 'Offertes gaan de deur uit en daarna hoor je niets meer. Na weken weet niemand of het een ja of een nee is.'
  change: 'Een vaste opvolging na elke verstuurde offerte, met belmomenten en een melding bij stilte, tot er een ja of nee is.'
  result: 'Meer gewonnen offertes, en een reden bij elke offerte die je verliest.'
updated: 2026-10-10
trigger: Een offerte wordt verstuurd.
goal: Een duidelijk ja of nee op elke offerte, en weten waarom.
enroll:
  object: offerte
  'on': offerte.status = Verstuurd
steps:
- id: s1
  title: Offerte met samenvatting
  after: direct
  action: e-mail
  to: klant.contactpersoon
  brief: De offerte, met een samenvatting in gewone woorden en de vraag wie er nog meebeslist.
- id: s2
  title: 'Bellen: aangekomen, vragen?'
  after: 3d
  action: taak
  owner: verkoper
  sla: 2 werkdagen
  brief: 'Bel: is de offerte goed aangekomen, zijn er vragen? Leg vast wie er meebeslist.'
- id: s3
  title: Antwoord op de vraag die altijd komt
  after: 7d
  if: offerte.status = Verstuurd
  action: e-mail
  to: klant.contactpersoon
  brief: Antwoord op de vraag die bij dit type werk het vaakst komt, of een voorbeeld van vergelijkbaar werk.
- id: s4
  title: 'Tweede gesprek: wat is er nodig?'
  after: 14d
  if: offerte.status = Verstuurd
  action: taak
  owner: verkoper
  sla: 2 werkdagen
  brief: 'Tweede gesprek: wat is er nodig om te beslissen?'
- id: s5
  title: 'Nog actueel? Ja, nee of later'
  after: 21d
  if: offerte.status = Verstuurd
  action: e-mail
  to: klant.contactpersoon
  brief: Is het nog actueel? Met de vraag om ja, nee of later.
exit:
- offerte.status = Gewonnen
- offerte.status = Verloren
handover:
  won: De onboarding start.
  lost: Reden van verlies vastleggen. Na 6 maanden een taak om opnieuw contact op te nemen.
next: onboarding
fields:
- offerte.verstuurd_op
- offerte.bedrag
- offerte.type_werk
- offerte.beslissers
- offerte.status
- offerte.reden_verlies
- klant.contactpersoon
metrics:
- offertes_per_maand
- offerte_winratio
- dagen_offerte_tot_beslissing
seo:
  title: Offerteopvolging automatiseren in B2B
  description: 'Workflow voor offerteopvolging in HubSpot of ActiveCampaign: vaste belmomenten, een duidelijk ja of nee en de reden van verlies. Met CRM-velden en metingen.'
why: 'Een offerte zonder opvolging is een gok. De klant vergelijkt, twijfelt en kiest wie zich laat zien. Deze workflow geeft elke offerte vaste momenten: een belletje na drie dagen, een tweede gesprek na twee weken en een eerlijke vraag na drie weken. En hij legt vast waarom je verliest, zodat je daarvan leert.'
example: 'Stel: 30 offertes per maand van gemiddeld €12.000, en je wint er nu 1 op de 4. Win je er 1 extra per maand, dan is dat €144.000 omzet per jaar.'
mistakes:
- Opvolgen met "heeft u de offerte ontvangen?". Vraag liever wie er meebeslist.
- Verloren offertes niet vastleggen. Zonder reden van verlies leer je niets.
- Blijven mailen zonder ooit te bellen.
faq:
- q: Hoe vaak volg je een offerte op?
  a: 'Deze workflow doet het vier keer in drie weken: twee keer bellen, twee keer mailen. Daarna vraag je om ja, nee of later. Meer wordt opdringerig, minder is laten liggen.'
- q: Werkt dit ook met offertesoftware buiten het CRM?
  a: Ja, zolang de status van de offerte in je CRM terechtkomt. Zonder die status weet de workflow niet wanneer hij moet stoppen.
