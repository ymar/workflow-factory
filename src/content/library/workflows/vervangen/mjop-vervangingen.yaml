# Zie onderhouden/contractverlenging.yaml voor uitleg bij elk veld.
code: VER-01
name: MJOP-vervangingen
version: 1.0.0
status: concept
phase: vervangen
segments: [installatie-onderhoud, machinebouw, it-dienstverlening, verhuur-en-lease]
needs_blueprint: true
owner: accountmanager
priority: 2
track: houden              # aantrekken | opvolgen | houden: de uitkomst waaronder de workflow in het menu valt
summary: 'Geplande vervangingen uit het meerjarenonderhoudsplan worden op tijd een offerte. Zodat de vervanging bij jou komt en niet als spoedklus bij een ander.'
outcome:
  context: 'Bedrijven met geplande vervangingen: een MJOP, retrofit, het einde van de levensduur van hardware of het einde van een leaseperiode.'
  issue: 'Na tien tot twintig jaar is de relatie afgekoeld, en de vervanging gaat naar wie als eerste een offerte stuurt.'
  change: 'Zes maanden voor de geplande vervanging een offertevoorstel, met een belmoment en vaste opvolging.'
  result: 'Meer vervangingen die je wint, als geplande opdracht en niet als spoedklus.'
updated: 2026-10-10
trigger: 6 maanden voor een geplande vervanging in het MJOP.
goal: De vervanging als opdracht bij jou, niet als spoedklus bij een ander.
enroll:
  object: mjop
  at: mjop.vervanging_op - 6m
steps:
- id: s1
  title: MJOP-regel en installatie bekijken
  at: mjop.vervanging_op - 6m
  action: taak
  owner: accountmanager
  sla: 10 werkdagen
  brief: Bekijk de MJOP-regel en de staat van de installatie.
- id: s2
  title: Aankondiging van de vervanging
  at: mjop.vervanging_op - 5m
  action: e-mail
  to: klant.contactpersoon
  brief: Deze vervanging staat gepland, en zo bereiden we haar voor.
- id: s3
  title: Offerte maken en bespreken
  at: mjop.vervanging_op - 4m
  action: taak
  owner: accountmanager
  sla: 10 werkdagen
  brief: Offerte maken en bespreken.
exit:
- offerte.status = Verstuurd
handover:
  won: 'Offerte verstuurd: de offerteopvolging neemt het over.'
next: offerteopvolging
fields:
- mjop.vervanging_op
- mjop.onderdeel
- mjop.budgetjaar
- installatie.staat
- installatie.type
- offerte.status
- klant.contactpersoon
- klant.accountmanager
metrics:
- geplande_vervangingen
- vervanging_gewonnen
- maanden_contact_tot_opdracht
seo:
  title: MJOP-vervangingen tijdig offreren
  description: 'Workflow voor geplande vervangingen uit het meerjarenonderhoudsplan: zes maanden vooraf een seintje, een bericht aan de klant en op tijd een offerte.'
why: 'Een vervanging die al in het MJOP staat, is een opdracht die je ziet aankomen. Toch wordt hij vaak pas besproken als het onderdeel het begeeft, en dan wint wie het snelst kan leveren. Deze workflow start zes maanden vooraf: tijd om de staat van de installatie te bekijken, de klant voor te bereiden en een offerte te maken voordat het budget op is.'
example: 'Stel: 40 geplande vervangingen per jaar van gemiddeld €8.000, en je wint er nu de helft. Win je er 8 meer, dan is dat €64.000 omzet.'
mistakes:
- Het MJOP alleen als pdf bewaren. Dan kan geen systeem erop reageren.
- Pas offreren als het budgetjaar al loopt.
- De staat van de installatie niet meenemen in het gesprek.
faq:
- q: Wat als de klant zelf geen MJOP heeft?
  a: 'Dan haal je de geplande vervangingen uit je eigen onderhoudshistorie. Het principe blijft hetzelfde: een datum per vervanging.'
