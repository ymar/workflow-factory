# Zie onderhouden/contractverlenging.yaml voor uitleg bij elk veld.
code: OND-03
name: Storingsopvolging
version: 1.0.0
status: concept
phase: onderhouden
segments:
- installatie-onderhoud
needs_blueprint: true
owner: accountmanager
priority: 1
summary: Na een storing volgt een check. Na de derde storing volgt een gesprek over vervanging.
updated: 2026-10-09
trigger: Een storingsmelding wordt afgesloten.
goal: Minder losse storingen, meer contracten en vervangingen.
enroll:
  object: storing
  'on': storing.afgesloten_op is ingevuld
steps:
- id: s1
  title: Gesprek over vervanging of contract
  after: direct
  if: storing.aantal_12m >= 3
  action: taak
  owner: accountmanager
  sla: 10 werkdagen
  brief: Gesprek over vervanging of een contract, met de storingshistorie erbij.
- id: s2
  title: 'Check: is het opgelost?'
  after: 1d
  action: e-mail
  to: klant.contactpersoon
  brief: 'Korte check: is het opgelost? Met een directe lijn als het terugkomt.'
- id: s3
  title: Uitleg over een onderhoudscontract
  after: 7d
  if: klant.heeft_contract = nee
  action: e-mail
  to: klant.contactpersoon
  brief: 'Uitleg over een onderhoudscontract: wat het voorkomt en wat het inhoudt.'
exit:
- na de laatste stap
handover:
  won: 'De klant wil vervangen: er wordt een offerte gemaakt en de offerteopvolging start.'
next: offerteopvolging
fields:
- storing.afgesloten_op
- storing.aantal_12m
- installatie.type
- klant.heeft_contract
- klant.contactpersoon
- klant.accountmanager
metrics:
- storingen_per_maand
- herhaalstoring_naar_vervanging
- dagen_derde_storing_tot_gesprek
seo:
  title: Storingsmeldingen opvolgen met automation
  description: 'Workflow na een storing: een check na een dag, uitleg over een onderhoudscontract en een gesprek over vervanging na de derde storing in een jaar.'
why: 'Bij een storing denkt de klant aan je, alleen niet positief. Deze workflow maakt er een kans van: een check of het echt is opgelost, uitleg over een onderhoudscontract voor wie er geen heeft, en een gesprek over vervanging zodra dezelfde installatie voor de derde keer in een jaar stoort.'
example: 'Stel: 48 installaties per jaar met drie of meer storingen. Kiest een kwart daarvan voor vervanging, dan zijn dat 12 opdrachten.'
mistakes:
- Storingen per klant tellen in plaats van per installatie.
- Een verkoopgesprek starten terwijl de storing nog niet is opgelost.
- Geen opvolging na de oplossing. De klant weet dan niet of het echt klaar is.
faq:
- q: Waarom pas na de derde storing?
  a: Eén storing is pech, drie in een jaar is een patroon. Je kunt de grens per type installatie aanpassen.
