# Zie onderhouden/contractverlenging.yaml voor uitleg bij elk veld.
code: GEB-05
name: Reviews en aanbevelingen
version: 1.0.0
status: concept
phase: gebruiken
segments: [installatie-onderhoud, machinebouw, it-dienstverlening, verhuur-en-lease]
needs_blueprint: false
owner: accountmanager
priority: 3
track: aantrekken
summary: 'Een tevreden klant krijgt twee dagen na de check de vraag om een review, en een maand later de vraag wie de klant nog meer kent. Zodat tevreden klanten nieuwe aanvragen opleveren.'
outcome:
  context: 'Bedrijven in installatie, machinebouw, IT-dienstverlening en verhuur die werk opleveren en daarna nooit om een review of aanbeveling vragen.'
  issue: 'Tevreden klanten vertellen het zelden door. Niemand vraagt ze om een review, en niemand vraagt wie ze nog meer kennen.'
  change: 'Twee dagen na een goede check de vraag om een review. Een maand later, als de review er is, de vraag wie de klant nog meer kent. Een aanbeveling krijgt binnen een werkdag een telefoontje.'
  result: 'Meer reviews en meer aanvragen van mensen die een tevreden klant van je kent.'
updated: 2026-10-10
trigger: De check na de oplevering heeft de uitkomst Goed.
goal: Een review, een aanbeveling en een nieuwe aanvraag van iemand die de klant kent.
enroll:
  object: project
  'on': project.check_uitkomst = Goed
steps:
- id: s1
  title: Vraag om een review
  after: 2d
  action: e-mail
  to: klant.contactpersoon
  brief: Een korte, persoonlijke vraag om een review, met één link.
  email:
    goal: Vragen als de klant tevreden is, en het zo makkelijk maken dat het in twee minuten kan. Eén link, geen formulier.
    subject: 'Mag ik {u|je} om een review vragen?'
    preheader: Het kost twee minuten.
    body: |
      Bij de check na de oplevering gaf {u|je} aan dat alles goed werkt. Fijn om te horen. [Eén ding dat goed ging bij dit project, in de woorden van de klant.]

      {Zou u|Zou je} in twee minuten willen vertellen hoe het was? Een review helpt andere bedrijven te zien wat ze van ons mogen verwachten. Het kan met de knop hieronder.

      Liever iets anders kwijt? Antwoord dan gewoon op deze mail.
    cta:
      label: Review plaatsen
      leads_to: De pagina waar klanten een review achterlaten, bijvoorbeeld je Google-bedrijfsprofiel.
- id: s2
  title: Vraag om een aanbeveling
  after: 30d
  if: project.review_geplaatst = ja
  action: e-mail
  to: klant.contactpersoon
  brief: Bedank voor de review en vraag wie de klant nog meer kent met hetzelfde probleem.
  email:
    goal: Alleen vragen aan wie al een review plaatste. Eén vraag, één naam is genoeg.
    subject: 'Wie {kent u|ken je} die hier ook mee zit?'
    preheader: Eén naam is genoeg.
    body: |
      Bedankt voor {uw|je} review. Dat waardeer ik.

      Een vraag: wie {kent u|ken je} die hier ook mee zit? [Het probleem dat je voor deze klant oploste, in de woorden van de klant.] Een collega, een leverancier, een bedrijf in dezelfde regio. Eén naam is genoeg.

      Antwoord op deze mail met een naam. Of laat weten dat ik eerst even mag vragen of ze open staan voor een gesprek. Dan neem ik pas contact op als zij dat willen.
- id: s3
  title: Aanbeveling opvolgen
  'on': klant.aanbeveling_ontvangen = ja
  action: taak
  owner: accountmanager
  sla: 1 werkdag
  brief: Neem binnen een werkdag contact op met de aanbevolen persoon, en noem de naam van de klant.
  checklist:
  - Bel of mail de aanbevolen persoon, met de naam van de klant erbij en in overleg met de klant.
  - Leg het gesprek vast als aanvraag. Aanvraagopvolging neemt het over.
  - Bedank de klant, ook als er niets uit komt.
exit:
- klant.aanbeveling_ontvangen = ja
- na s2
handover:
  won: 'Aanbeveling opgevolgd: de nieuwe aanvraag start in Aanvraagopvolging, met de naam van de klant als context.'
  lost: 'Geen review of aanbeveling na 30 dagen: de klant blijft in beeld via de kennismail.'
next: aanvraagopvolging
fields:
- project.check_uitkomst
- project.review_geplaatst
- klant.aanbeveling_ontvangen
- klant.contactpersoon
- klant.accountmanager
- contact.voornaam
- afzender.naam
- afzender.telefoon
metrics:
- review_na_verzoek
- reviews_per_maand
- aanbevelingen_per_kwartaal
seo:
  title: Reviews en aanbevelingen automatiseren
  description: 'Workflow die tevreden klanten om een review vraagt en daarna om een aanbeveling. Met twee voorbeeldmails, een belopdracht en de CRM-velden die je nodig hebt.'
why: 'Tevreden klanten zeggen zelden uit zichzelf dat ze tevreden zijn. Je moet het vragen, op het juiste moment: kort na een goede check. Deze workflow vraagt twee dagen na de check om een review en, als die er is, een maand later om een aanbeveling. De nazorg na oplevering draagt de klant over zodra de check Goed is. Een aanbeveling is geen mailing: ze krijgt een telefoontje binnen een werkdag.'
example: 'Stel: 80 opleveringen per jaar, waarvan 60 een goede check krijgen. Plaatst de helft van hen een review, dan zijn dat 30 reviews per jaar. Noemt een derde van die 30 een naam, dan zijn dat 10 aanbevelingen om te bellen.'
mistakes:
- Om een review vragen voordat je weet of de klant tevreden is. Wacht op de uitkomst Goed.
- Een aanbeveling vragen aan wie nog geen review plaatste.
- Een aanbeveling mailen in plaats van bellen. Een naam verdient een telefoontje, binnen een werkdag.
faq:
- q: Waarom twee dagen wachten na de check?
  a: De klant heeft net bevestigd dat het goed gaat. Twee dagen later is dat nog vers, en voelt de vraag niet als onderdeel van dezelfde mail.
- q: Hoe weet de workflow dat een review is geplaatst?
  a: Meestal niet automatisch. De accountmanager zet Review geplaatst op ja, of je koppelt je reviewsite. Zonder dat veld vraagt de workflow niet om een aanbeveling.
