# Zie onderhouden/contractverlenging.yaml voor uitleg bij elk veld.
code: GEB-03
name: Nabestellingen
version: 1.0.0
status: concept
phase: gebruiken
segments: [installatie-onderhoud, machinebouw, it-dienstverlening, verhuur-en-lease]
needs_blueprint: true
owner: binnendienst
priority: 3
track: houden              # aantrekken | opvolgen | houden: de uitkomst waaronder de workflow in het menu valt
summary: 'Vaste klanten bestellen opnieuw voordat ze bij een ander gaan kijken. Zodat herhaalorders niet naar een concurrent wegsijpelen.'
outcome:
  context: 'Bedrijven met vaste klanten die op vaste momenten bestellen: filters en materiaal, onderdelen, licenties en hardware, of extra materieel.'
  issue: 'Een vaste klant bestelt een keer ergens anders, en niemand merkt dat het bestelmoment voorbij is.'
  change: 'Opvolging die start op het moment dat de klant volgens eerdere orders weer iets nodig heeft.'
  result: 'Meer herhaalorders bij jou, op het moment dat de klant ze nodig heeft.'
updated: 2026-10-10
trigger: Het gebruikelijke bestelmoment van een klant komt eraan, op basis van eerdere orders.
goal: De volgende bestelling, op het moment dat de klant iets nodig heeft.
enroll:
  object: bestelling
  at: bestelling.volgende_verwacht_op - 5d
  if:
  - bestelling.interval_dagen is ingevuld
steps:
- id: s1
  title: Herinnering met de vorige bestelling
  at: bestelling.volgende_verwacht_op - 5d
  action: e-mail
  to: klant.contactpersoon
  brief: Herinnering met de vorige bestelling, klaar om opnieuw te bestellen.
- id: s2
  title: Bellen als er nog niet besteld is
  at: bestelling.volgende_verwacht_op + 2d
  if: bestelling.laatste_datum is niet bijgewerkt
  action: taak
  owner: binnendienst
  sla: 2 werkdagen
  brief: Bel als er nog niet besteld is.
- id: s3
  title: 'Signaal: bestelt niet meer zoals eerst'
  'on': de klant twee bestelmomenten overslaat
  action: melding
  to: klant.accountmanager
  brief: 'Signaal: deze klant bestelt niet meer zoals eerst.'
exit:
- bestelling.laatste_datum is bijgewerkt
handover:
  won: 'Bestelling geplaatst: het volgende bestelmoment wordt opnieuw berekend en de workflow start weer.'
fields:
- bestelling.laatste_datum
- bestelling.interval_dagen
- bestelling.volgende_verwacht_op
- klant.contactpersoon
- klant.accountmanager
metrics:
- klanten_met_bestelmoment
- op_tijd_herbesteld
- dagen_te_laat_besteld
seo:
  title: Nabestellingen stimuleren in B2B
  description: 'Workflow voor nabestellingen bij vaste klanten: een herinnering op het gebruikelijke bestelmoment, een telefoontje als het uitblijft en een signaal bij stilte.'
why: Vaste klanten bestellen in een ritme. Valt dat ritme stil, dan bestellen ze waarschijnlijk ergens anders, en merk je dat pas maanden later. Deze workflow berekent per klant wanneer de volgende bestelling verwacht wordt, helpt de klant daar op tijd aan herinneren, en waarschuwt de accountmanager zodra het ritme breekt.
example: 'Stel: 200 vaste klanten die elke 6 weken voor €1.500 bestellen. Bestelt 5% van hen één keer per jaar ergens anders, dan scheelt dat €15.000 omzet.'
mistakes:
- Eén vast interval voor alle klanten. Reken per klant met de eigen orderhistorie.
- Alleen herinneren, nooit bellen.
- Het signaal "bestelt niet meer" naar niemand sturen.
faq:
- q: Hoeveel orderhistorie heb je nodig?
  a: Minimaal drie eerdere bestellingen per klant. Met minder is het verwachte moment een gok.
