# Zie onderhouden/contractverlenging.yaml voor uitleg bij elk veld.
code: GEB-02
name: Nazorg na oplevering
version: 1.0.0
status: concept
phase: gebruiken
segments:
- installatie-onderhoud
needs_blueprint: true
owner: accountmanager
priority: 2
summary: Na de oplevering hoort de klant weer van je, voordat er iets kapot is.
trigger: De opleverdatum van een project.
goal: Een tevreden klant, een review en een onderhoudscontract.
enroll:
  object: project
  at: project.opleverdatum
  not_if:
  - klant.open_storing = ja
steps:
- id: s1
  at: project.opleverdatum + 7d
  action: e-mail
  to: klant.contactpersoon
  brief: 'Korte check: werkt alles? Met een directe lijn voor vragen.'
- id: s2
  at: project.opleverdatum + 30d
  if: project.check_uitkomst = Goed
  action: e-mail
  to: klant.contactpersoon
  brief: De vraag om een review.
- id: s3
  at: project.opleverdatum + 30d
  if: klant.heeft_contract = nee
  action: taak
  owner: accountmanager
  sla: 5 werkdagen
  brief: 'Bel: hoort er een onderhoudscontract bij deze installatie?'
- id: s4
  at: project.opleverdatum + 60d
  if: klant.heeft_contract = nee
  action: e-mail
  to: klant.contactpersoon
  brief: 'Uitleg over onderhoud: wat het voorkomt en wat een contract inhoudt.'
exit:
- klant.heeft_contract = ja
handover:
  won: 'Contract getekend: de einddatum gaat in het systeem en de contractverlenging staat klaar.'
  lost: 'Na 90 dagen geen contract: de klant blijft in beeld via storingsopvolging en keuringen.'
next: contractverlenging
fields:
- project.opleverdatum
- project.check_uitkomst
- installatie.type
- klant.heeft_contract
- klant.open_storing
- klant.contactpersoon
- klant.accountmanager
metrics:
- opleveringen
- oplevering_naar_contract
- dagen_oplevering_tot_contract
seo:
  title: Nazorg na oplevering automatiseren
  description: 'Workflow voor nazorg na een oplevering: een check na een week, de vraag om een review en een gesprek over een onderhoudscontract. Voor installatiebedrijven.'
why: 'Na de oplevering hoort de klant meestal pas weer iets als er iets kapot is. Dan wordt het gesprek over onderhoud een klachtgesprek. Deze workflow draait dat om: een check na een week, een review als het goed ging, en het gesprek over een contract terwijl de klant nog tevreden is.'
example: 'Stel: 80 opleveringen per jaar, en nu krijgt 20% een onderhoudscontract van €900 per jaar. Bij 35% zijn dat 12 contracten extra, ofwel €10.800 contractomzet per jaar, elk jaar opnieuw.'
mistakes:
- De opleverdatum niet invullen. Dan start de workflow nooit.
- Om een review vragen voordat je weet of de klant tevreden is.
- Het onderhoudscontract pas aanbieden na de eerste storing.
faq:
- q: Waarom wacht de workflow een week?
  a: Dan is de installatie een week in gebruik en weet de klant of alles werkt. Eerder vragen levert vooral beleefde antwoorden op.
