# Zie onderhouden/contractverlenging.yaml voor uitleg bij elk veld.
code: GEB-02
name: Nazorg na oplevering
version: 1.0.0
status: concept
phase: gebruiken
segments: [installatie-onderhoud, machinebouw, it-dienstverlening, verhuur-en-lease]
needs_blueprint: true
owner: accountmanager
priority: 2
track: houden              # aantrekken | opvolgen | houden: de uitkomst waaronder de workflow in het menu valt
summary: 'Na de oplevering hoort de klant weer van je, voordat er iets kapot is. Zodat het gesprek over onderhoud geen klachtgesprek wordt.'
outcome:
  context: 'Bedrijven die installaties, machines of systemen opleveren, in installatie, machinebouw, IT-dienstverlening en verhuur.'
  issue: 'Na de oplevering hoort de klant pas weer van je bij een storing. Dan wordt het gesprek over onderhoud een klachtgesprek.'
  change: 'Een check na een week, een gesprek over een onderhoudscontract terwijl de klant nog tevreden is, en uitleg over wat onderhoud voorkomt.'
  result: 'Meer onderhoudscontracten uit opleveringen.'
updated: 2026-10-10
trigger: De opleverdatum van een project.
goal: Een tevreden klant en een onderhoudscontract.
enroll:
  object: project
  at: project.opleverdatum
  not_if:
  - klant.open_storing = ja
steps:
- id: s1
  title: 'Check: werkt alles?'
  at: project.opleverdatum + 7d
  action: e-mail
  to: klant.contactpersoon
  brief: 'Korte check: werkt alles? Met een directe lijn voor vragen. De uitkomst gaat in het CRM, zodat de volgende workflow weet of de klant tevreden is.'
  sets: project.check_uitkomst
- id: s2
  title: Bellen over een onderhoudscontract
  at: project.opleverdatum + 30d
  if: klant.heeft_contract = nee
  action: taak
  owner: accountmanager
  sla: 5 werkdagen
  brief: 'Bel: hoort er een onderhoudscontract bij deze installatie?'
- id: s3
  title: Uitleg over onderhoud
  at: project.opleverdatum + 60d
  if: klant.heeft_contract = nee
  action: e-mail
  to: klant.contactpersoon
  brief: 'Uitleg over onderhoud: wat het voorkomt en wat een contract inhoudt.'
exit:
- klant.heeft_contract = ja
handover:
  won: 'Contract getekend: de einddatum gaat in het systeem en de contractverlenging staat klaar. Was de uitkomst van de check Goed, dan vraagt Reviews en aanbevelingen om een review.'
  lost: 'Na 90 dagen geen contract: de klant blijft in beeld via storingsopvolging en keuringen.'
next: contractverlenging
fields:
- project.opleverdatum
- project.check_uitkomst
- installatie.type
- klant.heeft_contract
- klant.open_storing
- klant.contactpersoon
- klant.accountmanager
metrics:
- opleveringen
- oplevering_naar_contract
- dagen_oplevering_tot_contract
seo:
  title: Nazorg na oplevering automatiseren
  description: 'Voor bedrijven die opleveren: een check na een week en een gesprek over onderhoud terwijl de klant tevreden is, zodat er meer contracten komen. Met CRM-velden.'
why: 'Na de oplevering hoort de klant meestal pas weer iets als er iets kapot is. Dan wordt het gesprek over onderhoud een klachtgesprek. Deze workflow draait dat om: een check na een week en het gesprek over een contract terwijl de klant nog tevreden is. De vraag om een review komt daarna uit Reviews en aanbevelingen, als de check goed was.'
example: 'Stel: 80 opleveringen per jaar, en nu krijgt 20% een onderhoudscontract van €900 per jaar. Bij 35% zijn dat 12 contracten extra, ofwel €10.800 contractomzet per jaar, elk jaar opnieuw.'
mistakes:
- De opleverdatum niet invullen. Dan start de workflow nooit.
- De uitkomst van de check niet vastleggen. Dan weet de volgende workflow niet of de klant tevreden is.
- Het onderhoudscontract pas aanbieden na de eerste storing.
faq:
- q: Waarom wacht de workflow een week?
  a: Dan is de installatie een week in gebruik en weet de klant of alles werkt. Eerder vragen levert vooral beleefde antwoorden op.
