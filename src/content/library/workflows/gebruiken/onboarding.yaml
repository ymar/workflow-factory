# Zie onderhouden/contractverlenging.yaml voor uitleg bij elk veld.
code: GEB-01
name: Onboarding
version: 1.0.0
status: concept
phase: gebruiken
segments: [installatie-onderhoud, machinebouw, it-dienstverlening, verhuur-en-lease]
needs_blueprint: true
owner: projectleider
priority: 2
track: opvolgen              # aantrekken | opvolgen | houden: de uitkomst waaronder de workflow in het menu valt
summary: 'Een nieuwe klant weet vanaf dag één wat er gebeurt, met wie en wanneer. Zodat de eerste opdracht niet de laatste is.'
outcome:
  context: 'Bedrijven die na een gewonnen offerte een project of implementatie uitvoeren, van installatie tot IT-dienstverlening.'
  issue: 'Na het ja gaat de klant van verkoop naar uitvoering, en niemand vertelt wat er nu gebeurt.'
  change: 'Een welkomstmail met planning en contactpersoon, een overdracht van verkoper naar uitvoering en belmomenten rond de start.'
  result: 'Klanten die tevreden starten en vaker een tweede opdracht geven.'
updated: 2026-10-10
trigger: Een offerte wordt gewonnen.
goal: Een goede start, zodat de eerste opdracht niet de laatste is.
enroll:
  object: offerte
  'on': offerte.status = Gewonnen
steps:
- id: s1
  title: Welkom, met planning en contactpersoon
  after: direct
  action: e-mail
  to: klant.contactpersoon
  brief: Welkom, met de planning, de vaste contactpersoon en wat de klant zelf moet regelen.
- id: s2
  title: Overdracht naar de uitvoering
  after: direct
  action: taak
  owner: verkoper
  sla: 2 werkdagen
  brief: 'Overdracht naar uitvoering: wat is beloofd, en wat is belangrijk voor deze klant.'
- id: s3
  title: Herinnering aan de planning
  at: project.startdatum - 7d
  action: e-mail
  to: klant.contactpersoon
  brief: Herinnering aan de planning en wat er klaar moet staan.
- id: s4
  title: 'Belmoment: loopt alles?'
  at: project.startdatum + 3d
  action: taak
  owner: projectleider
  sla: 2 werkdagen
  brief: 'Kort belmoment: loopt alles zoals afgesproken?'
exit:
- project.opleverdatum is ingevuld
handover:
  won: 'Opleverdatum ingevuld: de nazorg na oplevering neemt het over.'
next: nazorg-na-oplevering
fields:
- offerte.status
- offerte.gewonnen_op
- project.startdatum
- project.uitvoerder
- project.opleverdatum
- klant.contactpersoon
metrics:
- nieuwe_klanten
- tweede_opdracht_binnen_jaar
- dagen_gewonnen_tot_start
seo:
  title: Klantonboarding automatiseren in B2B
  description: 'Voor bedrijven die na een gewonnen offerte uitvoeren: een start waarin de klant weet wat er gebeurt, zodat de eerste opdracht niet de laatste is.'
why: Tussen "getekend" en "gestart" verliest een klant vaak het overzicht. Verkoop is weg, de uitvoering moet nog beginnen. Deze workflow zorgt dat de klant weet wie er komt en wanneer, en dat de uitvoering weet wat er beloofd is. Zo wordt de eerste opdracht niet de laatste.
example: 'Stel: 60 nieuwe klanten per jaar, en nu geeft 30% binnen een jaar een tweede opdracht. Bij 40% zijn dat 6 vervolgopdrachten per jaar extra.'
mistakes:
- Een overdracht zonder notities. De uitvoering begint dan zonder te weten wat er beloofd is.
- Alleen een welkomstmail, en daarna niets tot de oplevering.
- Geen vaste contactpersoon noemen.
faq:
- q: Wanneer start de onboarding?
  a: Zodra een offerte op Gewonnen gaat. Een betrouwbare offertestatus in je CRM is dus een voorwaarde.
